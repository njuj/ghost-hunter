<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"><defs><style>.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.glow{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}</style><radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset=".6" stop-color="#00e5ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="1280" height="440" rx="18" fill="#0b0f17"/><rect width="1280" height="440" rx="18" fill="url(#grid)"/><rect width="1280" height="440" rx="18" fill="url(#g)"/><rect x="48" y="44" width="6" height="58" rx="3" fill="#00e5ff"/><text x="72" y="70" font-size="13" letter-spacing="4" fill="#6e7681">NJUJ / TOOL</text><text x="72" y="104" font-size="40" font-weight="800" fill="#f0f3f6">ghost-hunter</text><text x="72" y="140" font-size="17" fill="#00e5ff">Find code injected into running Windows processes.</text><g class="n" style="animation-delay:0.25s"><rect x="72" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="320" y="226" text-anchor="end" font-size="12" fill="#3d4757">01</text><g transform="translate(92 216) scale(1.6)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g><text x="92" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Running processes</text><text x="92" y="322" font-size="13" fill="#8b949e">every process, or the</text><text x="92" y="342" font-size="13" fill="#8b949e">PIDs you choose</text></g><path class="flow" d="M342 280.0 H370" stroke="#00e5ff" stroke-width="2" fill="none" opacity=".8"/><path d="M364 275.0 l6 5 -6 5" stroke="#00e5ff" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.60s"><rect x="376" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="624" y="226" text-anchor="end" font-size="12" fill="#3d4757">02</text><g transform="translate(396 216) scale(1.6)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="9" rx="1"/><path d="M6 10v3M10 10v3M14 10v3M18 10v3M5 16v3M19 16v3"/></g><text x="396" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Walk the memory</text><text x="396" y="322" font-size="13" fill="#8b949e">private RX regions, threads,</text><text x="396" y="342" font-size="13" fill="#8b949e">modules, import tables</text></g><path class="flow" d="M646 280.0 H674" stroke="#00e5ff" stroke-width="2" fill="none" opacity=".8"/><path d="M668 275.0 l6 5 -6 5" stroke="#00e5ff" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.95s"><rect x="680" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="928" y="226" text-anchor="end" font-size="12" fill="#3d4757">03</text><g transform="translate(700 216) scale(1.6)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></g><text x="700" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Spot the injection</text><text x="700" y="322" font-size="13" fill="#8b949e">reflective DLLs, shellcode,</text><text x="700" y="342" font-size="13" fill="#8b949e">hollowing, hooks, stomping</text></g><path class="flow" d="M950 280.0 H978" stroke="#00e5ff" stroke-width="2" fill="none" opacity=".8"/><path d="M972 275.0 l6 5 -6 5" stroke="#00e5ff" stroke-width="2" fill="none"/><g class="n" style="animation-delay:1.30s"><rect class="glow" x="984" y="196" width="266" height="168" rx="14" fill="#00e5ff" opacity=".18" filter="url(#sh)"/><rect x="984" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#00e5ff" stroke-width="2"/><text x="1232" y="226" text-anchor="end" font-size="12" fill="#3d4757">04</text><g transform="translate(1004 216) scale(1.6)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/></g><text x="1004" y="294" font-size="17" font-weight="700" fill="#f0f3f6">ATT&amp;CK findings</text><text x="1004" y="322" font-size="13" fill="#8b949e">T1055 / T1620 with</text><text x="1004" y="342" font-size="13" fill="#8b949e">the evidence bytes</text></g><g class="n" style="animation-delay:1.8s"><rect x="72" y="378" width="90" height="28" rx="14" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="117" y="397" text-anchor="middle" font-size="12.5" fill="#00e5ff">read-only</text></g><g class="n" style="animation-delay:1.8s"><rect x="172.39999999999998" y="378" width="151" height="28" rx="14" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="248" y="397" text-anchor="middle" font-size="12.5" fill="#00e5ff">zero dependencies</text></g><g class="n" style="animation-delay:1.8s"><rect x="333.59999999999997" y="378" width="75" height="28" rx="14" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="371" y="397" text-anchor="middle" font-size="12.5" fill="#00e5ff">Windows</text></g><g class="n" style="animation-delay:1.8s"><rect x="418.79999999999995" y="378" width="83" height="28" rx="14" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="460" y="397" text-anchor="middle